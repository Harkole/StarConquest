<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarConquest — 3D Space RTS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04060d;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      }
      #app-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud-overlay {
        position: fixed;
        top: 16px;
        left: 16px;
        max-width: 680px;
        padding: 14px 16px;
        background: rgba(8, 13, 26, 0.82);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      #hud-overlay h1 {
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #38bdf8;
      }
      .hud-subtitle {
        font-size: 0.78rem;
        color: #94a3b8;
        margin-top: 2px;
      }
      .hud-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
        margin-bottom: 5px;
      }
      .hud-btn-row,
      .hud-planet-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .hud-btn {
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.45);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 0.76rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }
      .hud-btn:hover {
        border-color: #38bdf8;
        background: rgba(30, 41, 59, 0.95);
      }
      .hud-btn.active {
        background: rgba(14, 165, 233, 0.22);
        border-color: #38bdf8;
        color: #ffffff;
      }
      .hud-badge {
        font-size: 0.65rem;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(56, 189, 248, 0.16);
        color: #7dd3fc;
        text-transform: uppercase;
      }
      .hud-planet-card {
        background: rgba(15, 23, 42, 0.85);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.4);
        border-radius: 6px;
        padding: 7px 10px;
        text-align: left;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .hud-planet-card:hover {
        border-color: #38bdf8;
        transform: translateY(-1px);
      }
      .planet-card-title {
        font-size: 0.78rem;
        font-weight: 600;
        color: #f8fafc;
      }
      .planet-card-meta {
        font-size: 0.7rem;
        color: #94a3b8;
        margin-top: 2px;
      }
      .planet-card-theme {
        font-size: 0.68rem;
        color: #38bdf8;
        margin-top: 2px;
        text-transform: capitalize;
      }
      .hud-controls-hint {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 0.72rem;
        color: #94a3b8;
        border-top: 1px solid rgba(51, 65, 85, 0.5);
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>
    <div id="hud-overlay"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
