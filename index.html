<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarConquest — 3D Space RTS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04060d;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      }
      #app-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .hud-top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        min-height: 44px;
        padding: 6px 14px;
        background: rgba(8, 13, 26, 0.88);
        border-bottom: 1px solid rgba(56, 189, 248, 0.35);
        backdrop-filter: blur(10px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
        z-index: 20;
      }
      .hud-left-outliner {
        position: fixed;
        top: 56px;
        left: 12px;
        bottom: 12px;
        width: 228px;
        overflow-y: auto;
        padding: 10px;
        background: rgba(8, 13, 26, 0.84);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
      }
      .hud-bottom-inspector {
        position: fixed;
        bottom: 12px;
        left: 252px;
        right: 234px;
        max-width: 800px;
        margin-inline: auto;
        max-height: 46vh;
        overflow-y: auto;
        padding: 10px 14px;
        background: rgba(8, 13, 26, 0.84);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
      }
      .hud-quick-dock {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 210px;
        padding: 10px;
        background: rgba(8, 13, 26, 0.84);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: auto;
      }
      .hud-quick-dock .hud-btn {
        width: 100%;
        justify-content: center;
      }
      .hud-top-right-slot {
        position: fixed;
        top: 56px;
        right: 12px;
        width: 320px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 150px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
        z-index: 25;
      }
      .hud-top-right-slot > div {
        pointer-events: none;
      }
      .top-bar-system strong {
        color: #38bdf8;
      }
      .top-bar-yield {
        font-size: 0.68rem;
        color: #94a3b8;
      }
      .outliner-section {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      }
      .outliner-section:last-child {
        padding-bottom: 0;
        border-bottom: none;
      }
      .outliner-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .outliner-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .outliner-list .hud-btn,
      .outliner-list .hud-planet-card {
        width: 100%;
        justify-content: space-between;
      }
      .outliner-btn-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .outliner-reserves {
        font-size: 0.68rem;
        color: #94a3b8;
        line-height: 1.35;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(71, 85, 105, 0.35);
        border-radius: 6px;
        padding: 5px 7px;
      }
      .outliner-reserves strong {
        color: #e2e8f0;
      }
      .econ-metrics,
      .econ-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .econ-pill {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(100, 116, 139, 0.4);
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .econ-pill.ore strong {
        color: #f59e0b;
      }
      .econ-pill.crystal strong {
        color: #7dd3fc;
      }
      .econ-pill.supply strong {
        color: #a7f3d0;
      }
      .econ-label {
        font-size: 0.65rem;
        color: #94a3b8;
        letter-spacing: 0.06em;
      }
      .hud-harvester-inspector {
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      }
      .harvester-telemetry-card {
        margin-top: 7px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(56, 189, 248, 0.45);
        border-radius: 7px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .telemetry-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.76rem;
      }
      .telemetry-actions {
        display: flex;
        gap: 5px;
      }
      .telemetry-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.71rem;
        color: #cbd5e1;
      }
      .telemetry-progress-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .telemetry-progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: #94a3b8;
      }
      .telemetry-progress-bar {
        width: 100%;
        height: 8px;
        background: rgba(30, 41, 59, 0.95);
        border-radius: 4px;
        overflow: hidden;
      }
      .telemetry-progress-fill {
        height: 100%;
        transition: width 0.2s linear;
      }
      .telemetry-progress-fill.ore {
        background: linear-gradient(90deg, #d97706, #f59e0b);
      }
      .telemetry-progress-fill.crystal {
        background: linear-gradient(90deg, #0284c7, #7dd3fc);
      }
      .hud-inspector-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .hud-subtitle {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 2px;
      }
      .hud-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
        margin-bottom: 5px;
      }
      .hud-btn-row,
      .hud-planet-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .hud-btn {
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.45);
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 0.74rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }
      .hud-btn:hover {
        border-color: #38bdf8;
        background: rgba(30, 41, 59, 0.95);
      }
      .hud-btn.active {
        background: rgba(14, 165, 233, 0.22);
        border-color: #38bdf8;
        color: #ffffff;
      }
      .hud-badge {
        font-size: 0.62rem;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(56, 189, 248, 0.16);
        color: #7dd3fc;
        text-transform: uppercase;
      }
      .hud-planet-card {
        background: rgba(15, 23, 42, 0.85);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.4);
        border-radius: 6px;
        padding: 6px 10px;
        text-align: left;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .hud-planet-card:hover,
      .hud-planet-card.selected {
        border-color: #38bdf8;
        background: rgba(14, 165, 233, 0.16);
      }
      .planet-card-title {
        font-size: 0.76rem;
        font-weight: 600;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .planet-card-meta {
        font-size: 0.68rem;
        color: #94a3b8;
        margin-top: 2px;
      }
      .slot-ring-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 8px;
      }
      .slot-pill {
        background: rgba(15, 23, 42, 0.85);
        color: #cbd5e1;
        border: 1px solid rgba(100, 116, 139, 0.4);
        border-radius: 5px;
        padding: 4px 8px;
        font-size: 0.7rem;
        cursor: pointer;
      }
      .slot-pill.occupied {
        border-color: rgba(56, 189, 248, 0.65);
        color: #7dd3fc;
      }
      .slot-pill.building {
        border-color: rgba(245, 158, 11, 0.75);
        color: #fcd34d;
      }
      .slot-pill.selected {
        background: rgba(56, 189, 248, 0.25);
        border-color: #38bdf8;
        color: #ffffff;
        font-weight: 600;
      }
      .build-options-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
        gap: 6px;
      }
      .build-card-btn {
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.45);
        border-radius: 6px;
        padding: 6px 9px;
        text-align: left;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .build-card-btn:hover:not(:disabled) {
        border-color: #38bdf8;
        background: rgba(30, 41, 59, 0.95);
      }
      .build-card-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .build-card-name {
        font-size: 0.74rem;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .build-card-cost {
        font-size: 0.68rem;
        color: #f59e0b;
        margin-top: 2px;
      }
      .build-card-note {
        font-size: 0.65rem;
        color: #94a3b8;
        margin-top: 2px;
      }
      .slot-detail-box {
        grid-column: 1 / -1;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 0.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .hud-status-msg {
        margin-top: 6px;
        font-size: 0.72rem;
        color: #38bdf8;
      }
      .hud-controls-hint {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 0.7rem;
        color: #94a3b8;
        border-top: 1px solid rgba(51, 65, 85, 0.5);
        padding-top: 7px;
      }
      .hud-lobby-host {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hud-koth-banner {
        pointer-events: auto;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(245, 158, 11, 0.55);
        border-radius: 7px;
        padding: 7px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .koth-banner-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
      }
      .hud-outcome-banner {
        pointer-events: auto;
        background: rgba(15, 23, 42, 0.96);
        border: 2px solid #22c55e;
        border-radius: 8px;
        padding: 9px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .outcome-banner-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .hud-lobby-drawer {
        pointer-events: auto;
        background: rgba(10, 17, 34, 0.96);
        border: 1px solid rgba(56, 189, 248, 0.55);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .lobby-drawer-header,
      .lobby-drawer-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .lobby-drawer-header {
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      }
      .lobby-drawer-footer {
        padding-top: 8px;
        border-top: 1px solid rgba(51, 65, 85, 0.6);
      }
      .lobby-preset-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
        gap: 7px;
      }
      .lobby-preset-card {
        background: rgba(15, 23, 42, 0.88);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.45);
        border-radius: 7px;
        padding: 8px 10px;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 3px;
        transition: all 0.15s ease;
      }
      .lobby-preset-card:hover,
      .lobby-preset-card.selected {
        border-color: #38bdf8;
        background: rgba(14, 165, 233, 0.18);
      }
      .lobby-slots-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lobby-slot-row {
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(71, 85, 105, 0.45);
        border-radius: 7px;
        padding: 7px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lobby-slot-header,
      .lobby-slot-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
      }
      .lobby-faction-swatch {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: inline-block;
      }
      .lobby-standing-pill {
        font-size: 0.68rem;
        padding: 2px 7px;
        border-radius: 4px;
        background: rgba(30, 41, 59, 0.9);
        color: #94a3b8;
      }
      .lobby-standing-pill[data-tone="active"] {
        background: rgba(34, 197, 94, 0.16);
        color: #86efac;
      }
      .lobby-standing-pill[data-tone="defeated"] {
        background: rgba(239, 68, 68, 0.18);
        color: #fca5a5;
      }
      .lobby-p2p-panel {
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 7px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lobby-p2p-header,
      .lobby-p2p-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .lobby-p2p-row {
        justify-content: flex-start;
      }
      .lobby-p2p-input {
        background: rgba(2, 6, 23, 0.85);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.55);
        border-radius: 5px;
        padding: 4px 8px;
        font-size: 0.72rem;
        min-width: 130px;
        flex: 1 1 140px;
      }
      .lobby-p2p-input:focus {
        outline: none;
        border-color: #38bdf8;
      }
      .lobby-p2p-status {
        font-size: 0.7rem;
        color: #7dd3fc;
      }
      .hud-tutorial-coach {
        width: 100%;
        pointer-events: auto;
        background: rgba(10, 17, 34, 0.94);
        border: 1px solid rgba(251, 191, 36, 0.8);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 14px rgba(245, 158, 11, 0.2);
        backdrop-filter: blur(8px);
      }
      .tutorial-coach-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .tutorial-coach-badge {
        background: rgba(245, 158, 11, 0.24);
        color: #fde68a;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .tutorial-coach-progress {
        font-size: 0.72rem;
        font-weight: 700;
        color: #fbbf24;
      }
      .tutorial-coach-title {
        font-size: 0.84rem;
        font-weight: 700;
        color: #f8fafc;
      }
      .tutorial-coach-instruction {
        font-size: 0.74rem;
        line-height: 1.4;
        color: #e2e8f0;
      }
      .tutorial-coach-hint {
        font-size: 0.7rem;
        line-height: 1.35;
        color: #cbd5e1;
        border-left: 2px solid rgba(251, 191, 36, 0.75);
        padding-left: 7px;
      }
      .tutorial-highlight {
        outline: 2px solid #fbbf24 !important;
        outline-offset: 2px;
        border-color: #fbbf24 !important;
        background-color: rgba(245, 158, 11, 0.22) !important;
        color: #fef3c7 !important;
        position: relative;
        z-index: 2;
        animation: tutorialPulse 1.35s ease-in-out infinite;
      }
      #hud-root.menu-active {
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: auto;
        overflow-y: auto;
      }
      .menu-backdrop {
        min-height: 100%;
        width: 100%;
        padding: 28px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 22% 18%, rgba(56, 189, 248, 0.14), transparent 44%),
          radial-gradient(circle at 78% 82%, rgba(99, 102, 241, 0.12), transparent 46%),
          linear-gradient(180deg, #040712 0%, #070d1d 52%, #03060e 100%);
      }
      .menu-panel {
        width: 100%;
        max-width: 680px;
        background: rgba(8, 13, 26, 0.92);
        border: 1px solid rgba(56, 189, 248, 0.38);
        border-radius: 12px;
        padding: 24px 26px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 20px 56px rgba(0, 0, 0, 0.65), 0 0 28px rgba(14, 165, 233, 0.12);
      }
      .menu-panel--wide {
        max-width: 920px;
      }
      .menu-hero {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.24);
      }
      #hud-root .menu-title {
        font-size: 1.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f8fafc;
        text-shadow: 0 0 18px rgba(56, 189, 248, 0.38);
      }
      #hud-root .menu-section-title {
        font-size: 1.05rem;
        letter-spacing: 0.05em;
        text-transform: none;
        color: #f8fafc;
      }
      .menu-subtitle {
        font-size: 0.84rem;
        color: #94a3b8;
        line-height: 1.45;
      }
      .menu-actions-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      @media (max-width: 560px) {
        .menu-actions-grid {
          grid-template-columns: 1fr;
        }
      }
      .menu-action-card {
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
        border: 1px solid rgba(100, 116, 139, 0.45);
        border-radius: 9px;
        padding: 14px 16px;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
      }
      .menu-action-card:hover {
        border-color: #38bdf8;
        background: rgba(20, 35, 62, 0.96);
        transform: translateY(-1px);
      }
      .menu-action-card.primary {
        border-color: rgba(56, 189, 248, 0.72);
        background: rgba(14, 165, 233, 0.18);
      }
      .menu-action-card.primary:hover {
        background: rgba(14, 165, 233, 0.28);
      }
      .menu-action-title {
        font-size: 0.92rem;
        font-weight: 700;
        color: #f8fafc;
      }
      .menu-action-desc {
        font-size: 0.74rem;
        color: #94a3b8;
        line-height: 1.35;
      }
      .menu-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(51, 65, 85, 0.6);
      }
      .menu-help-note {
        font-size: 0.72rem;
        line-height: 1.4;
        color: #cbd5e1;
