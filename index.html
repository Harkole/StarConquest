<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarConquest — 3D Space RTS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04060d;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud-overlay {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        background: rgba(10, 16, 32, 0.8);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }
      #hud-overlay h1 {
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 4px;
      }
      #hud-overlay p {
        font-size: 0.8rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>
    <div id="hud-overlay">
      <h1>StarConquest</h1>
      <p id="hud-status">Initializing 5-System Galaxy...</p>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
